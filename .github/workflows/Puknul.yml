
name: Download and Extract Moonward

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar-free

      - name: Download archive
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/kokobashka-alt/Plusclient2/releases/download/Alpha/Moonward-recovered.rar" \
            -o /tmp/Moonward-recovered.rar

      - name: Extract into repository root
        run: |
          set -euo pipefail
          unrar-free -x /tmp/Moonward-recovered.rar ./
          ls -la

      - name: Commit extracted files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract Moonward archive into repository root"
            git push
          fi
          
