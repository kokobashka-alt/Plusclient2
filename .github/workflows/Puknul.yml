
name: Download and Extract Moonward

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar-free

      - name: Download archive
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/kokobashka-alt/Plusclient2/releases/download/Alpha/Moonward-recovered.rar" \
            -o /tmp/Moonward-recovered.rar

          test -s /tmp/Moonward-recovered.rar

      - name: Extract archive
        run: |
          set -euo pipefail

          mkdir -p /tmp/moonward
          unrar-free -x /tmp/Moonward-recovered.rar /tmp/moonward/

          echo "Archive structure:"
          find /tmp/moonward -maxdepth 3 -print

      - name: Move files into repository root
        run: |
          set -euo pipefail

          SOURCE="/tmp/moonward/Moonward-recovered"

          if [ ! -d "$SOURCE" ]; then
            echo "ERROR: Moonward-recovered folder not found"
            exit 1
          fi

          cp -a "$SOURCE/." ./

          echo "Repository root after extraction:"
          ls -la

      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import Moonward recovered files"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/moonward
          rm -f /tmp/Moonward-recovered.rar
          
